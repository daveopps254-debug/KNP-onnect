apiVersion: apps/v1
kind: Deployment
metadata:
  name: knp-connect-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: knp-connect-api
  template:
    metadata:
      labels:
        app: knp-connect-api
    spec:
      containers:
        - name: api
          image: knp-connect-api:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: knp-connect-config
            - secretRef:
                name: knp-connect-secret
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
