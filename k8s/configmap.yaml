apiVersion: v1
kind: ConfigMap
metadata:
  name: knp-connect-config
data:
  ENVIRONMENT: "production"
  DATABASE_URL: "postgresql+psycopg://knp:knp@postgres:5432/knp_connect"
  CORS_ORIGINS: "https://your-frontend.example"
  REDIS_URL: "redis://redis:6379/0"
  S3_ENDPOINT_URL: "http://minio:9000"
  S3_REGION: "us-east-1"
  S3_BUCKET: "knp-connect"
  S3_PUBLIC_BASE_URL: "https://media.your-domain.example/knp-connect"
  PUBLIC_BASE_URL: "https://api.your-domain.example"
  SMTP_PORT: "587"
  SMTP_USE_TLS: "true"
